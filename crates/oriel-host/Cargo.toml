[package]
name = "oriel-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oriel-proto.workspace = true
oriel-net.workspace = true
oriel-media.workspace = true
oriel-audio.workspace = true
oriel-clipboard.workspace = true
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
quinn.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rand.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
pipewire = "0.10"
futures-util = { version = "0.3", default-features = false }
# Virtual gamepads through uinput.
evdev = "0.13"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
# Virtual Xbox 360 gamepads through the ViGEmBus driver.
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows = { workspace = true, features = [
  "Win32_System_RemoteDesktop",
  "Win32_System_Environment",
  "Win32_Security_Authorization",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_Security",
  "Win32_Media",
  "Win32_System_LibraryLoader",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Capture",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
] }
