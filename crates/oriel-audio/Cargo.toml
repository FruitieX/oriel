[package]
name = "oriel-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
parking_lot.workspace = true
cpal = "0.18"
opus = "0.4"
crossbeam-channel.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
# Lists PipeWire sinks by their user-facing names.
cpal = { version = "0.18", features = ["pipewire"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Foundation"] }
