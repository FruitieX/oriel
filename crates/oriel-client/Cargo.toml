[package]
name = "oriel-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oriel-proto.workspace = true
oriel-net.workspace = true
oriel-media.workspace = true
oriel-audio.workspace = true
oriel-clipboard.workspace = true
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
quinn.workspace = true
tracing.workspace = true
winit.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
serde.workspace = true
png = "0.18"
ash = { version = "0.38", default-features = false, features = ["std"] }
toml.workspace = true
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties = "0.1"
jni = "0.21"

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Fake controllers for the gamepad tests.
evdev = "0.13"
