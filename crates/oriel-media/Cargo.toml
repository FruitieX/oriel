[package]
name = "oriel-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oriel-proto.workspace = true
anyhow.workspace = true
tracing.workspace = true
libloading = "0.8"
ash = { version = "0.38", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
] }

# PyroWave's Metal port decodes into Metal textures.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLCommandBuffer",
  "MTLCommandQueue",
  "MTLDevice",
  "MTLPixelFormat",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
] }

# Android decodes through MediaCodec instead of FFmpeg.
[target.'cfg(not(target_os = "android"))'.dependencies]
ffmpeg-sys-next.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media", "api-level-28"] }
