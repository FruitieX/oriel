[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FruitieX/oriel"

[workspace.dependencies]
oriel-proto = { path = "crates/oriel-proto" }
oriel-net = { path = "crates/oriel-net" }
oriel-media = { path = "crates/oriel-media" }
oriel-host = { path = "crates/oriel-host" }
oriel-client = { path = "crates/oriel-client" }
oriel-audio = { path = "crates/oriel-audio" }
oriel-clipboard = { path = "crates/oriel-clipboard" }

anyhow = "=1.0.104"
thiserror = "=2.0.21"
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { version = "=1.1.3", features = ["use-std"] }
toml = "=1.1.8+spec-1.1.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "=0.14.10"
sha2 = "=0.11.1"
spake2 = "=0.4.0"
hmac = "=0.13.0"
rand = "=0.10.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
clap = { version = "=4.6.7", features = ["derive"] }
directories = "=6.0.0"
ffmpeg-sys-next = "=9.0.1"
winit = "=0.30.13"
wgpu = "=30.0.1"
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui-wgpu = "=0.37.0"
egui-winit = "=0.37.0"
pollster = "=1.0.1"
crossbeam-channel = "=0.5.17"
parking_lot = "=0.13.0"
arboard = { version = "=3.7.0", default-features = false }
windows-service = "=0.8.1"
tray-icon = "=0.26.1"
hex = "=0.4.3"
windows = "=0.62.2"
[profile.release]
strip = "debuginfo"
