# cargo-about (scripts/rust-notices.sh): the licenses the Rust crates
# compiled into oriel may use, in order of preference where a crate offers
# a choice. A crate under any other license fails the notice generation.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unlicense",
  "WTFPL",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# cargo-about's built-in clarifications for crates whose license files it
# cannot match on its own.
workarounds = ["ring", "rustls"]
