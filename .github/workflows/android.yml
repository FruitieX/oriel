name: Android
# The APK (x86_64), on pull requests that touch what it is built from: the
# Gradle project, the crates the app links (all but the desktop binary and
# the hub), the dependencies, the Android dev shell and the build script.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - crates/**
      - "!crates/oriel/**"
      - "!crates/oriel-hub/**"
      - assets/oriel.svg
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - scripts/build-android.sh
      - scripts/rust-notices.sh
      - about.toml
      - packaging/notices/**
      - .github/workflows/android.yml
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop .#android-ci --command scripts/build-android.sh --abi x86_64
