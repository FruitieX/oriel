name: Windows
# The Windows host and client, cross-compiled (clippy), on pull requests
# that touch what they are built from: every crate but the hub and the
# Android glue, the dependencies, the dev shell (mingw, FFmpeg, PyroWave)
# and the build script.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/**
      - "!crates/oriel-hub/**"
      - "!crates/oriel-android/**"
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - nix/**
      - scripts/build-windows.sh
      - .github/workflows/windows.yml
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command scripts/build-windows.sh --check
