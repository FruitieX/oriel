name: Hub
on:
  workflow_dispatch:
  # Every pull request (Renovate's too) gets the full checks, whatever it
  # touches: the hub's container is only published from main.
  pull_request:
  push:
    branches: [main]
    paths:
      - crates/oriel-hub/**
      - crates/oriel-proto/**
      - Cargo.lock
      - flake.nix
      - flake.lock
      - nix/closure-notices.nix
      - scripts/rust-notices.sh
      - about.toml
      - packaging/notices/**
      - .github/workflows/hub.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: oriel-hub-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Builds the hub and runs its tests (including the API smoke tests).
      - run: nix build .#hub-container --out-link result-container
      - name: Smoke test the container
        run: |
          docker load -i result-container
          docker run -d --name hub -p 8080:8080 \
            -e ORIEL_HUB_OIDC_ISSUER=http://127.0.0.1:9 \
            -e ORIEL_HUB_OIDC_CLIENT_ID=ci -e ORIEL_HUB_OIDC_CLIENT_SECRET=ci \
            ghcr.io/fruitiex/oriel-hub:main
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/devices)" = 401
          docker cp hub:/licenses/THIRD-PARTY-NOTICES-RUST.txt - > /dev/null
          docker cp hub:/licenses/THIRD-PARTY-NOTICES.txt - > /dev/null
          docker logs hub
          docker rm -f hub
      - name: Publish container
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/fruitiex/oriel-hub:main ghcr.io/fruitiex/oriel-hub:${{ github.sha }}
          docker push ghcr.io/fruitiex/oriel-hub:main
          docker push ghcr.io/fruitiex/oriel-hub:${{ github.sha }}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/fruitiex/oriel-hub:main | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy to homelab
        if: steps.publish.outputs.digest != '' && env.HAS_DISPATCH_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {"image": "ghcr.io/fruitiex/oriel-hub", "digest": "${{ steps.publish.outputs.digest }}", "revision": "${{ github.sha }}"}
